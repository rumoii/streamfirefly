[package]
name = "streamfirefly-native"
version = "0.9.1"
edition = "2021"

[dependencies]
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
