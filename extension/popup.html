<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>流萤</title><link rel="icon" href="icon16.png"><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <header><div class="brand"><img src="icon48.png" alt="流萤"><div><h1>流萤</h1><p>网页媒体发现与下载</p></div></div><div class="header-actions"><button id="settings" class="ghost-button">设置</button><button id="refresh" class="ghost-button">刷新</button></div></header>
    <section id="status" class="status">正在读取当前页面…</section>
    <section id="candidates" class="list"></section>
    <section id="tasks-panel" class="tasks-panel" hidden>
      <button id="tasks-toggle" class="tasks-toggle" type="button" aria-expanded="false" aria-controls="tasks-list">
        <span class="tasks-heading"><span class="tasks-icon" aria-hidden="true"></span><span>下载任务</span></span>
        <span id="tasks-summary" class="tasks-summary"></span>
        <span class="chevron" aria-hidden="true"></span>
      </button>
      <div id="tasks-list" class="list" hidden></div>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
