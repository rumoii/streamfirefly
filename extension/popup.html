<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>流萤</title><link rel="icon" href="icon16.png"><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <header><div class="brand"><img src="icon48.png" alt="流萤"><div><h1>流萤</h1><p>网页媒体发现与下载</p></div></div><div class="header-actions"><button id="sniffing-toggle" class="ghost-button" type="button" aria-pressed="false">暂停嗅探</button><button id="refresh" class="ghost-button" type="button">刷新</button></div></header>
    <nav class="app-nav" aria-label="流萤功能"><button type="button" data-view="resources" aria-current="page"><span>资源</span><small id="nav-resource-count">0</small></button><button type="button" data-view="tasks"><span>下载</span><small id="nav-task-count">0</small></button><button type="button" data-view="settings"><span>设置</span></button><button id="open-workbench" type="button"><span>媒体工作台</span></button></nav>
    <section id="status" class="status" role="status" hidden></section>
    <div id="resources-view" class="app-view" data-view-panel="resources">
    <section id="candidates-panel" class="candidates-panel">
      <div id="candidates-header" class="candidates-header">
        <div class="candidates-heading"><span class="candidates-icon" aria-hidden="true"></span><span>发现资源</span><span id="candidates-count" class="candidates-count"></span></div>
        <button id="candidates-toggle" class="collapse-button" type="button" aria-expanded="true" aria-controls="candidates-content"><span id="candidates-toggle-label">收起</span><span class="panel-chevron" aria-hidden="true"></span></button>
      </div>
      <div id="candidates-content" class="candidates-content">
        <div class="candidates-body">
          <section id="candidate-sort-toolbar" class="sort-toolbar" hidden>
            <div class="sort-caption"><span class="sort-icon" aria-hidden="true"></span><span>资源排序</span></div>
            <div class="sort-menu">
              <button id="candidate-sort-trigger" class="sort-trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="candidate-sort-menu">
                <span id="candidate-sort-label">嗅探顺序</span><span class="sort-chevron" aria-hidden="true"></span>
              </button>
              <div id="candidate-sort-menu" class="sort-menu-panel" role="menu" hidden>
                <button type="button" role="menuitemradio" data-sort="detected" aria-checked="false"><span><strong>嗅探顺序</strong><small>最新发现优先</small></span><span class="sort-check" aria-hidden="true">✓</span></button>
                <button type="button" role="menuitemradio" data-sort="size" aria-checked="false"><span><strong>文件大小</strong><small>从大到小排列</small></span><span class="sort-check" aria-hidden="true">✓</span></button>
                <button type="button" role="menuitemradio" data-sort="duration" aria-checked="false"><span><strong>媒体时长</strong><small>从长到短排列</small></span><span class="sort-check" aria-hidden="true">✓</span></button>
                <button type="button" role="menuitemradio" data-sort="type" aria-checked="false"><span><strong>类型分组</strong><small>视频、音频、图片</small></span><span class="sort-check" aria-hidden="true">✓</span></button>
              </div>
            </div>
          </section>
          <div id="candidate-sort-hint" class="sort-hint" role="note" hidden>提示：视频资源通常体积较大，按文件大小排序可以更快找到视频。</div>
          <section id="candidate-filter-toolbar" class="filter-toolbar" hidden>
            <input id="candidate-filter-regex" type="search" placeholder="正则筛选名称、URL 或 MIME" aria-label="正则筛选资源">
            <select id="candidate-filter-type" aria-label="按资源类型筛选"><option value="all">全部类型</option><option value="video">视频与流媒体</option><option value="audio">音频</option><option value="image">图片</option></select>
            <div class="size-range"><input id="candidate-min-size" type="number" min="0" step="1" placeholder="最小 MB" aria-label="最小文件大小 MB"><span>—</span><input id="candidate-max-size" type="number" min="0" step="1" placeholder="最大 MB" aria-label="最大文件大小 MB"></div>
            <div id="filter-error" class="filter-error" role="alert"></div>
          </section>
          <section id="batch-toolbar" class="batch-toolbar" hidden><label><input id="select-all-candidates" type="checkbox"><span>全选当前结果</span></label><span id="selected-summary">已选 0 项</span><div><button id="batch-copy" type="button">复制</button><button id="batch-download" type="button">下载</button><button id="batch-remove" type="button" class="danger-text">移除</button></div></section>
          <section id="candidates" class="list" aria-live="polite"></section>
          <section id="segments-panel" class="segments-panel" hidden>
            <button id="segments-toggle" class="segments-toggle" type="button" aria-expanded="false" aria-controls="segments-content"><span><strong>媒体分片</strong><small id="segments-summary"></small></span><span class="chevron" aria-hidden="true"></span></button>
            <div id="segments-content" hidden><div id="segments-list" class="segments-list"></div><button id="segments-more" class="segments-more" type="button" hidden>再显示 100 个</button></div>
          </section>
        </div>
      </div>
    </section>
    </div>
    <div id="tasks-view" class="app-view" data-view-panel="tasks" hidden>
    <section id="tasks-panel" class="tasks-panel">
      <button id="tasks-toggle" class="tasks-toggle" type="button" aria-expanded="false" aria-controls="tasks-list">
        <span class="tasks-heading"><span class="tasks-icon" aria-hidden="true"></span><span>下载任务</span></span>
        <span id="tasks-summary" class="tasks-summary"></span>
        <span class="chevron" aria-hidden="true"></span>
      </button>
      <div id="tasks-list" class="list" hidden></div>
    </section>
    </div>
    <section id="settings-view" class="app-view settings-view" data-view-panel="settings" hidden>
      <div class="settings-heading"><div><h2>设置</h2><p>配置新任务和媒体识别方式，保存后立即生效。</p></div></div>
      <label class="settings-field" for="inline-save-dir"><span>默认保存目录</span><input id="inline-save-dir" type="text" placeholder="例如 D:\Downloads\StreamFirefly"></label>
      <label class="settings-field" for="inline-download-threads"><span>下载并发数</span><input id="inline-download-threads" type="number" min="1" max="16" step="1" value="6"><small>普通文件和流媒体分片建议使用 4–8 路。</small></label>
      <label class="settings-toggle"><input id="inline-detect-images" type="checkbox"><span><strong>识别图片</strong><small>显示 JPG、PNG、GIF 和 WebP，刷新目标网页后生效。</small></span></label>
      <label class="settings-toggle"><input id="inline-advanced-search" type="checkbox"><span><strong>高级深度搜索</strong><small>额外观察页面解码和 Worker，可能影响少数复杂页面。</small></span></label>
      <div class="settings-actions"><button id="inline-settings-save" class="primary-button" type="button">验证并保存</button><button id="inline-settings-reset" type="button">恢复默认</button></div>
      <div id="inline-settings-message" class="settings-message" role="status"></div>
    </section>
  </main>
  <div id="download-dialog" class="dialog-backdrop" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="download-dialog-title">
      <div class="dialog-head"><div><h2 id="download-dialog-title">开始下载</h2><p id="download-dialog-source">设置文件名称和保存位置</p></div><button id="download-cancel" class="icon-button" type="button" aria-label="取消">×</button></div>
      <label class="dialog-label" for="download-name">文件名称</label>
      <div class="filename-input"><input id="download-name" type="text" maxlength="100" autocomplete="off"><span id="download-extension">.mp4</span></div>
      <div id="download-name-error" class="dialog-error" role="alert"></div>
      <div class="dialog-path"><span>保存目录</span><strong id="download-save-dir">系统默认目录</strong></div>
      <div class="dialog-actions"><button id="download-confirm" class="primary-button" type="button">开始下载</button><button id="download-cancel-secondary" type="button">取消</button></div>
    </section>
  </div>
  <div id="delete-dialog" class="dialog-backdrop" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="delete-dialog-title">
      <div class="dialog-head"><div><h2 id="delete-dialog-title">删除下载任务</h2><p id="delete-dialog-message">请选择要删除的内容</p></div><button id="delete-cancel" class="icon-button" type="button" aria-label="取消">×</button></div>
      <div id="delete-choice" class="delete-choice"><button id="delete-record" type="button"><strong>仅删除记录</strong><span>保留本地文件，不再显示此任务</span></button><button id="delete-record-file" class="danger-button" type="button"><strong>删除记录和本地文件</strong><span>同时删除已下载的文件或临时文件</span></button></div>
      <div id="delete-confirmation" class="delete-confirmation" hidden>
        <div class="confirm-warning"><span class="warning-icon" aria-hidden="true">!</span><div><strong id="delete-confirm-title">确认删除</strong><p id="delete-confirm-message"></p></div></div>
        <div class="confirm-path" id="delete-confirm-path"></div>
        <div class="dialog-actions"><button id="delete-confirm-back" type="button">返回</button><button id="delete-confirm-submit" class="danger-button" type="button">确认删除</button></div>
      </div>
      <div id="delete-error" class="dialog-error" role="alert"></div>
      <div id="delete-choice-actions" class="dialog-actions"><button id="delete-cancel-secondary" type="button">取消</button></div>
    </section>
  </div>
  <script src="lib/hls.min.js"></script><script src="candidate-sort.js"></script><script src="popup.js"></script>
</body>
</html>
