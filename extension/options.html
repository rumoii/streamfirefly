<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>流萤设置</title><link rel="icon" href="icon16.png"><style>body{margin:0;padding:32px;max-width:680px;background:#f5f7fb;color:#26364a;font:14px system-ui,sans-serif}main{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:24px;box-shadow:0 4px 16px #253a5510}h1{margin:0 0 8px}p{color:#71839a}label{display:block;margin-top:22px;font-weight:600}input{display:block;width:100%;margin-top:8px;padding:10px;border:1px solid #c9d6e6;border-radius:8px;font:inherit}button{margin-top:12px;border:0;border-radius:8px;padding:9px 14px;background:#36a990;color:#fff;font-weight:600;cursor:pointer}button.secondary{margin-left:8px;background:#edf4f2;color:#287a69}.hint{font-size:12px;color:#8798aa}.message{margin-top:14px;min-height:20px;color:#287a69}.message.error{color:#a54848}</style></head>
<body><main><h1>流萤设置</h1><p>配置新下载任务使用的默认保存目录和并发连接数。</p><label for="save-dir">默认保存目录</label><input id="save-dir" type="text" placeholder="例如 D:\Downloads\StreamFirefly"><div class="hint">目录不存在时，流萤会尝试创建；请填写绝对路径。</div><label for="download-threads">下载并发数</label><input id="download-threads" type="number" min="1" max="16" step="1" value="6"><div class="hint">支持 Range 的普通文件和流媒体分片会使用此并发数，建议 4–8。</div><button id="save">验证并保存</button><button id="reset" class="secondary">恢复默认</button><div id="message" class="message" role="status"></div></main><script src="options.js"></script></body></html>
