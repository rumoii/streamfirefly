<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>流萤设置</title><link rel="icon" href="icon16.png"><style>body{margin:0;padding:32px;max-width:680px;background:#f5f7fb;color:#26364a;font:14px system-ui,sans-serif}main{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:24px;box-shadow:0 4px 16px #253a5510}h1{margin:0 0 8px}h2{margin:28px 0 4px;font-size:16px}p{color:#71839a}label.field{display:block;margin-top:22px;font-weight:600}input[type="text"],input[type="number"]{box-sizing:border-box;display:block;width:100%;margin-top:8px;padding:10px;border:1px solid #c9d6e6;border-radius:8px;font:inherit}.toggle{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-weight:600}.toggle input{margin-top:2px}.toggle small{display:block;margin-top:4px;color:#8798aa;font-weight:400;line-height:1.5}button{margin-top:20px;border:0;border-radius:8px;padding:9px 14px;background:#36a990;color:#fff;font-weight:600;cursor:pointer}button.secondary{margin-left:8px;background:#edf4f2;color:#287a69}.hint{font-size:12px;color:#8798aa}.message{margin-top:14px;min-height:20px;color:#287a69}.message.error{color:#a54848}</style></head>
<body><main><h1>流萤设置</h1><p>配置媒体识别方式和新下载任务的默认参数。</p><label class="field" for="save-dir">默认保存目录</label><input id="save-dir" type="text" placeholder="例如 D:\Downloads\StreamFirefly"><div class="hint">目录不存在时，流萤会尝试创建；请填写绝对路径。</div><label class="field" for="download-threads">下载并发数</label><input id="download-threads" type="number" min="1" max="16" step="1" value="6"><div class="hint">支持 Range 的普通文件和流媒体分片会使用此并发数，建议 4–8。</div><h2>媒体识别</h2><label class="toggle"><input id="detect-images" type="checkbox"><span>识别图片<small>默认关闭。开启后会显示页面请求中的 JPG、PNG、GIF 和 WebP；刷新目标网页后生效。</small></span></label><label class="toggle"><input id="advanced-deep-search" type="checkbox"><span>高级深度搜索<small>默认关闭。额外观察 JSON 解码、Base64、文本解码和同源经典 Worker；可能影响少数复杂页面，刷新目标网页后生效。</small></span></label><button id="save">验证并保存</button><button id="reset" class="secondary">恢复默认</button><div id="message" class="message" role="status"></div></main><script src="options.js"></script></body></html>
