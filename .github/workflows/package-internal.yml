name: Package internal test bundles

on:
  workflow_dispatch:
    inputs:
      bundle_version:
        description: Internal bundle version
        required: true
        default: 0.10.0-beta.5
        type: string
      expected_commit:
        description: Exact main commit to package
        required: true
        type: string
      capture_soak_seconds:
        description: Capture soak duration (7200 required before publishing a pre-release)
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '7200'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      BUNDLE_VERSION: ${{ inputs.bundle_version }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - name: Check out the requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify source identity
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw "Internal packages must be dispatched from main, got $env:GITHUB_REF" }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_COMMIT) { throw "Checked out $actual, expected $env:EXPECTED_COMMIT" }
          git merge-base --is-ancestor 6da471c0440a153b291e45f648b9ebbf9a0afbe0 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'The package source does not contain the media false-positive fix' }
          $status = @(git status --porcelain)
          if ($status.Count) { throw "Checkout is dirty: $($status -join '; ')" }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Rust targets
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0-x86_64-pc-windows-msvc --profile minimal
          rustup default 1.98.0-x86_64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          cargo --version
          rustc --version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify source behavior
        shell: pwsh
        run: |
          npm run validate:extension
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:unit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:capture:runtime:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:packaging:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ui:browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:browsers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:discovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint:firefox
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path native-host/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and audit both architectures
        shell: pwsh
        run: |
          .\tools\package-internal-test.ps1 -BundleVersion $env:BUNDLE_VERSION

      - name: Smoke test the packaged x64 install
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP 'streamfirefly-x64-install-smoke'
          $installDir = Join-Path $env:RUNNER_TEMP 'streamfirefly-x64-installed'
          Expand-Archive -LiteralPath ".\release\StreamFirefly-$env:BUNDLE_VERSION-internal-x64.zip" -DestinationPath $extract
          $bundle = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
          if (-not $bundle) { throw 'The x64 bundle root was not found' }
          $installScript = Join-Path $bundle.FullName 'tools\install-internal-test.ps1'
          $uninstallScript = Join-Path $bundle.FullName 'tools\uninstall-internal-test.ps1'
          $registryPaths = @(
            'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.streamfirefly.native',
            'HKCU:\Software\Microsoft\Edge\NativeMessagingHosts\com.streamfirefly.native',
            'HKCU:\Software\Mozilla\NativeMessagingHosts\com.streamfirefly.native'
          )
          $installed = $false
          try {
            & $installScript -ChromeExtensionId ('a' * 32) -EdgeExtensionId ('b' * 32) -InstallDir $installDir
            $installed = $true
            foreach ($path in $registryPaths) { if (-not (Test-Path -LiteralPath $path)) { throw "Native Messaging registration is missing: $path" } }
            $env:STREAMFIREFLY_NATIVE_EXE = Join-Path $installDir 'streamfirefly-native.exe'
            $env:STREAMFIREFLY_FFMPEG_EXE = Join-Path $installDir 'ffmpeg.exe'
            $env:STREAMFIREFLY_FFPROBE_EXE = (Get-ChildItem -LiteralPath '.\tools\ffmpeg-cache\x64-extracted' -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName
            if (-not $env:STREAMFIREFLY_FFPROBE_EXE) { throw 'Capture output inspection requires FFprobe' }
            $env:STREAMFIREFLY_EXTENSION_DIR = Join-Path $bundle.FullName 'extension'
            $env:STREAMFIREFLY_ISOLATED_INSTALL_TEST = '1'
            npm run test:native
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Native Host protocol test failed' }
            npm run test:discovery:native
            if ($LASTEXITCODE -ne 0) { throw 'Generated HLS/DASH discovery and packaged Native download failed' }
            npm run test:capture:browser
            if ($LASTEXITCODE -ne 0) { throw 'Chrome capture transport test failed' }
            npm run test:capture:installed
            if ($LASTEXITCODE -ne 0) { throw 'Installed browser capture chain failed' }
            if ('${{ inputs.capture_soak_seconds }}' -eq '7200') {
              npm run test:capture:soak
              if ($LASTEXITCODE -ne 0) { throw 'Two-hour installed capture soak failed' }
            }
            $ffmpegVersion = @(& (Join-Path $installDir 'ffmpeg.exe') -version)
            $ffmpegExitCode = $LASTEXITCODE
            if ($ffmpegExitCode -ne 0) { throw "Packaged FFmpeg version check failed with exit code $ffmpegExitCode" }
            if ($ffmpegVersion.Count -eq 0 -or [string]::IsNullOrWhiteSpace($ffmpegVersion[0])) { throw 'Packaged FFmpeg returned no version output' }
            $ffmpegVersion[0]
          } finally {
            if ($installed) { & $uninstallScript -InstallDir $installDir }
          }
          foreach ($path in $registryPaths) { if (Test-Path -LiteralPath $path) { throw "Native Messaging registration was not removed: $path" } }
          if (Test-Path -LiteralPath $installDir) { throw "Temporary install directory was not removed: $installDir" }

      - name: Upload audited internal bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: StreamFirefly-${{ inputs.bundle_version }}-internal
          path: |
            release/StreamFirefly-${{ inputs.bundle_version }}-internal-x64.zip
            release/StreamFirefly-${{ inputs.bundle_version }}-internal-arm64.zip
            release/INTERNAL-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload capture test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Capture-evidence-${{ github.run_id }}
          path: test-results/capture/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload discovery download evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Discovery-evidence-${{ github.run_id }}
          path: |
            test-results/generated-hls-browser.json
            test-results/generated-hls-native.json
            test-results/generated-dash-browser.json
            test-results/native-dash.json
            test-results/native-dash-browser.json
          if-no-files-found: warn
          retention-days: 14
