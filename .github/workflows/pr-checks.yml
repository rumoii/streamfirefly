name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide which checks to run
        id: scope
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $files = @(git diff --name-only "$env:BASE_SHA...$env:HEAD_SHA")
          if ($LASTEXITCODE -ne 0) { throw 'Could not list the changed files' }
          'Changed files:'; $files | ForEach-Object { "  $_" }
          # An empty diff runs everything instead of passing silently.
          $all = $files.Count -eq 0
          $code = $all -or @($files | Where-Object { $_ -notmatch '^(docs/|store-assets/|\.github/ISSUE_TEMPLATE/)|\.md$' }).Count -gt 0
          $native = $all -or @($files | Where-Object { $_ -match '^(native-host/|tools/test-native|tools/hold-test-|tools/native-test-tools\.mjs|tools/download-curl\.ps1|tools/curl/|Cargo\.)' }).Count -gt 0
          "code=$($code.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "native=$($native.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Documentation only
        if: steps.scope.outputs.code != 'true'
        run: echo "Only documentation changed; code checks are skipped."

      - name: Set up Node.js
        if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Rust
        if: steps.scope.outputs.native == 'true'
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0-x86_64-pc-windows-msvc --profile minimal
          rustup default 1.98.0-x86_64-pc-windows-msvc
          cargo --version

      - name: Install JavaScript dependencies
        if: steps.scope.outputs.code == 'true'
        run: npm ci

      - name: Prepare pinned media test dependencies
        if: steps.scope.outputs.native == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The native helper runs the bundled minimal FFmpeg; fixtures and ffprobe use the full test-only build.
          .\tools\download-ffmpeg.ps1 -Architecture x64
          $minimal = New-Item -ItemType Directory -Force -Path 'tools\ffmpeg-cache\minimal-x64'
          Copy-Item -LiteralPath 'tools\ffmpeg-cache\ffmpeg-x64.exe' -Destination (Join-Path $minimal.FullName 'ffmpeg.exe') -Force
          "STREAMFIREFLY_FFMPEG_EXE=$(Join-Path $minimal.FullName 'ffmpeg.exe')" >> $env:GITHUB_ENV
          .\tools\download-fixture-ffmpeg.ps1 | Where-Object { $_ -like 'STREAMFIREFLY_*=*' } >> $env:GITHUB_ENV

      - name: Type check, extension validation and unit tests
        if: steps.scope.outputs.code == 'true'
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run validate:extension
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:unit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native helper tests
        if: steps.scope.outputs.native == 'true'
        shell: pwsh
        run: |
          cargo test --manifest-path native-host/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
