name: Verify draft release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Numeric draft release ID containing final attachments
        required: true
        type: string
      expected_commit:
        description: Full main source SHA to verify
        required: true
        type: string
permissions:
  contents: write # GitHub requires push access to read an unpublished draft.
concurrency:
  group: release-draft
  cancel-in-progress: false
jobs:
  source:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ inputs.release_id }}
      BUNDLE_VERSION: '1.0.0'
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - name: Check out the requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - name: Verify source identity
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main' -or $env:EXPECTED_COMMIT -notmatch '^[a-f0-9]{40}$') { throw 'Dispatch from main with a full source SHA' }
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_COMMIT -or @(git status --porcelain).Count) { throw 'Source identity mismatch or dirty checkout' }
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Rust targets
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0-x86_64-pc-windows-msvc --profile minimal
          rustup default 1.98.0-x86_64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          cargo --version
          rustc --version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Download exact draft attachments
        shell: pwsh
        run: |
          if ($env:RELEASE_ID -notmatch '^\d+$') { throw 'Invalid release ID' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.draft -or $release.prerelease -or $release.tag_name -ne "v$env:BUNDLE_VERSION" -or $release.target_commitish -ne $env:EXPECTED_COMMIT) { throw 'Draft release identity mismatch' }
          New-Item -ItemType Directory -Path release | Out-Null
          foreach ($asset in $release.assets) {
            if ($asset.name -notmatch '^(StreamFirefly-[A-Za-z0-9.-]+\.(zip|xpi)|StreamFirefly-ffmpeg-source-1\.0\.0\.tar\.gz\.part[0-9]{3}|FFMPEG-SOURCE-MANIFEST\.json|SHA256SUMS\.txt)$') { throw 'Unsafe asset name' }
            $data = Invoke-WebRequest -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/octet-stream'} -Uri $asset.url -OutFile (Join-Path 'release' $asset.name)
          }
          .\tools\verify-release-assets.ps1 -Directory release -ExpectedSourceCommit $env:EXPECTED_COMMIT
      - name: Prepare test inspection tools
        shell: pwsh
        run: |
          .\tools\download-ffmpeg.ps1 -Architecture x64
          $driverZip = Join-Path $env:RUNNER_TEMP 'geckodriver.zip'
          Invoke-WebRequest -Uri 'https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-win64.zip' -OutFile $driverZip
          if ((Get-FileHash -LiteralPath $driverZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'dfed9315abe8d2fbc1b6161a2ee8002452e79cf05ee92fdc653a4e26bc35edd8') { throw 'Geckodriver checksum mismatch' }
          $driverDir = Join-Path $env:RUNNER_TEMP 'geckodriver'
          Expand-Archive -LiteralPath $driverZip -DestinationPath $driverDir
          "GECKODRIVER_BINARY=$(Join-Path $driverDir 'geckodriver.exe')" >> $env:GITHUB_ENV
      - name: Verify native upgrade and rollback from the final bundle
        shell: pwsh
        run: |
          $baselineRoot = Join-Path $env:RUNNER_TEMP 'streamfirefly-rollback-source'
          $baselineTar = Join-Path $env:RUNNER_TEMP 'streamfirefly-rollback-source.tar'
          New-Item -ItemType Directory -Path $baselineRoot | Out-Null
          git archive --format=tar --output=$baselineTar 44b296ba36b84ad74358a90524d1ad83dfe5687b native-host
          if ($LASTEXITCODE -ne 0) { throw 'Rollback baseline archive failed' }
          tar -xf $baselineTar -C $baselineRoot
          if ($LASTEXITCODE -ne 0) { throw 'Rollback baseline extraction failed' }
          cargo build --locked --release --target x86_64-pc-windows-msvc --manifest-path (Join-Path $baselineRoot 'native-host\Cargo.toml')
          if ($LASTEXITCODE -ne 0) { throw 'Rollback baseline build failed' }
          $upgradeRoot = Join-Path $env:RUNNER_TEMP 'streamfirefly-upgrade-bundle'
          Expand-Archive -LiteralPath ".\release\StreamFirefly-$env:BUNDLE_VERSION-windows-x64.zip" -DestinationPath $upgradeRoot
          $bundle = Join-Path $upgradeRoot "StreamFirefly-$env:BUNDLE_VERSION-windows-x64"
          $env:STREAMFIREFLY_ISOLATED_INSTALL_TEST = '1'
          node tools/test-release-upgrade.mjs $bundle (Join-Path $baselineRoot 'native-host\target\x86_64-pc-windows-msvc\release\streamfirefly-native.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Final bundle native upgrade or rollback failed' }
      - name: Smoke test the packaged x64 install
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP 'streamfirefly-x64-install-smoke'
          $installDir = Join-Path $env:RUNNER_TEMP 'streamfirefly-x64-installed'
          Expand-Archive -LiteralPath ".\release\StreamFirefly-$env:BUNDLE_VERSION-windows-x64.zip" -DestinationPath $extract
          $bundle = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
          if (-not $bundle) { throw 'The x64 bundle root was not found' }
          $installScript = Join-Path $bundle.FullName 'tools\install.ps1'
          $uninstallScript = Join-Path $bundle.FullName 'tools\uninstall.ps1'
          $registryPaths = @(
            'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.streamfirefly.native',
            'HKCU:\Software\Microsoft\Edge\NativeMessagingHosts\com.streamfirefly.native',
            'HKCU:\Software\Mozilla\NativeMessagingHosts\com.streamfirefly.native'
          )
          $installed = $false
          try {
            & $installScript -ChromeExtensionId ('a' * 32) -EdgeExtensionId ('b' * 32) -InstallDir $installDir
            $installed = $true
            foreach ($path in $registryPaths) { if (-not (Test-Path -LiteralPath $path)) { throw "Native Messaging registration is missing: $path" } }
            $env:STREAMFIREFLY_NATIVE_EXE = Join-Path $installDir 'streamfirefly-native.exe'
            $env:STREAMFIREFLY_FFMPEG_EXE = Join-Path $installDir 'ffmpeg.exe'
            $env:STREAMFIREFLY_FFPROBE_EXE = (Get-ChildItem -LiteralPath '.\tools\ffmpeg-cache\x64-extracted' -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName
            if (-not $env:STREAMFIREFLY_FFPROBE_EXE) { throw 'Capture output inspection requires FFprobe' }
            $env:STREAMFIREFLY_EXTENSION_DIR = Join-Path $bundle.FullName 'extension'
            $env:STREAMFIREFLY_ISOLATED_INSTALL_TEST = '1'
            npm run test:native
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Native Host protocol test failed' }
            npm run test:discovery:native
            if ($LASTEXITCODE -ne 0) { throw 'Generated HLS/DASH discovery and packaged Native download failed' }
            npm run test:capture:browser
            if ($LASTEXITCODE -ne 0) { throw 'Chrome capture transport test failed' }
            npm run test:capture:installed
            if ($LASTEXITCODE -ne 0) { throw 'Installed browser capture chain failed' }
            node tools/test-signed-firefox.mjs (Join-Path $bundle.FullName "StreamFirefly-firefox-$env:BUNDLE_VERSION-signed.xpi")
            if ($LASTEXITCODE -ne 0) { throw 'Signed Firefox permanent installation, restart or Native Messaging failed' }
            $ffmpegVersion = @(& (Join-Path $installDir 'ffmpeg.exe') -version)
            $ffmpegExitCode = $LASTEXITCODE
            if ($ffmpegExitCode -ne 0) { throw "Packaged FFmpeg version check failed with exit code $ffmpegExitCode" }
            if ($ffmpegVersion.Count -eq 0 -or [string]::IsNullOrWhiteSpace($ffmpegVersion[0])) { throw 'Packaged FFmpeg returned no version output' }
            $ffmpegVersion[0]
          } finally {
            if ($installed) { & $uninstallScript -InstallDir $installDir }
          }
          foreach ($path in $registryPaths) { if (Test-Path -LiteralPath $path) { throw "Native Messaging registration was not removed: $path" } }
          if (Test-Path -LiteralPath $installDir) { throw "Temporary install directory was not removed: $installDir" }
