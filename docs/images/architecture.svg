<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">流萤工作原理</title>
  <desc id="desc">网页中的内容脚本与页面探针把媒体交给浏览器扩展；扩展后台负责嗅探与识别，并与悬浮面板和工作区双向通信；扩展通过 Native Messaging 与 Rust 编写的本地助手通信；本地助手调用 curl 分段下载、调用 FFmpeg 合并封装。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eefbf6"/>
      <stop offset="1" stop-color="#e7effc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1d4a5c" flood-opacity="0.10"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a8f7b"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
      .card { fill: #ffffff; filter: url(#shadow); }
      .name { font-size: 26px; font-weight: 700; fill: #16324a; }
      .note { font-size: 17px; fill: #5b7083; }
      .link { stroke: #2a8f7b; stroke-width: 2.5; fill: none; }
      .label { font-size: 15px; font-weight: 600; fill: #2a8f7b; }
      .pill { fill: #d9f3ea; }
      .pill-text { font-size: 17px; font-weight: 700; fill: #22806d; }
    </style>
  </defs>

  <rect width="1200" height="480" rx="24" fill="url(#bg)"/>

  <!-- 网页 -->
  <rect class="card" x="30" y="110" width="210" height="100" rx="18"/>
  <text class="name" x="135" y="152" text-anchor="middle">网页</text>
  <text class="note" x="135" y="182" text-anchor="middle">内容脚本 · 页面探针</text>

  <!-- 浏览器扩展 -->
  <rect class="card" x="300" y="110" width="240" height="100" rx="18"/>
  <text class="name" x="420" y="152" text-anchor="middle">浏览器扩展</text>
  <text class="note" x="420" y="182" text-anchor="middle">后台嗅探与识别</text>

  <!-- 悬浮面板 -->
  <rect class="card" x="300" y="290" width="240" height="90" rx="18"/>
  <text class="name" x="420" y="328" text-anchor="middle">悬浮面板 / 工作区</text>
  <text class="note" x="420" y="356" text-anchor="middle">资源列表 · 下载任务</text>

  <!-- 本地助手 -->
  <rect class="card" x="730" y="110" width="210" height="100" rx="18"/>
  <text class="name" x="835" y="152" text-anchor="middle">本地助手</text>
  <text class="note" x="835" y="182" text-anchor="middle">Rust · 排队 · 断点续传</text>

  <!-- curl / FFmpeg -->
  <rect class="card" x="1010" y="50" width="160" height="90" rx="18"/>
  <text class="name" x="1090" y="88" text-anchor="middle">curl</text>
  <text class="note" x="1090" y="116" text-anchor="middle">分段下载</text>
  <rect class="card" x="1010" y="180" width="160" height="90" rx="18"/>
  <text class="name" x="1090" y="218" text-anchor="middle">FFmpeg</text>
  <text class="note" x="1090" y="246" text-anchor="middle">合并封装</text>

  <!-- 连线 -->
  <path class="link" d="M252 160 H288" marker-end="url(#head)"/>
  <path class="link" d="M420 222 V278" marker-start="url(#head)" marker-end="url(#head)"/>
  <path class="link" d="M552 160 H718" marker-start="url(#head)" marker-end="url(#head)"/>
  <text class="label" x="635" y="146" text-anchor="middle">Native Messaging</text>
  <path class="link" d="M952 160 C 978 160, 976 95, 998 95" marker-end="url(#head)"/>
  <path class="link" d="M952 160 C 978 160, 976 225, 998 225" marker-end="url(#head)"/>

  <!-- 底部标签 -->
  <rect class="pill" x="300" y="412" width="132" height="40" rx="20"/>
  <text class="pill-text" x="366" y="438" text-anchor="middle">没有账号</text>
  <rect class="pill" x="452" y="412" width="228" height="40" rx="20"/>
  <text class="pill-text" x="566" y="438" text-anchor="middle">任务和设置只存在本机</text>
  <rect class="pill" x="700" y="412" width="200" height="40" rx="20"/>
  <text class="pill-text" x="800" y="438" text-anchor="middle">不上传浏览记录</text>
</svg>
