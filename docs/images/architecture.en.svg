<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">How StreamFirefly works</title>
  <desc id="desc">Content scripts and the page probe hand media to the browser extension, which detects it in the background and talks both ways with the floating panel and workspace. The extension talks to the Rust native helper over Native Messaging; the helper runs curl for ranged downloads and FFmpeg to remux and merge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eefbf6"/>
      <stop offset="1" stop-color="#e7effc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1d4a5c" flood-opacity="0.10"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a8f7b"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
      .card { fill: #ffffff; filter: url(#shadow); }
      .name { font-size: 23px; font-weight: 700; fill: #16324a; }
      .note { font-size: 15px; fill: #5b7083; }
      .link { stroke: #2a8f7b; stroke-width: 2.5; fill: none; }
      .label { font-size: 15px; font-weight: 600; fill: #2a8f7b; }
      .pill { fill: #d9f3ea; }
      .pill-text { font-size: 17px; font-weight: 700; fill: #22806d; }
    </style>
  </defs>

  <rect width="1200" height="480" rx="24" fill="url(#bg)"/>

    <rect class="card" x="30" y="110" width="210" height="100" rx="18"/>
  <text class="name" x="135" y="152" text-anchor="middle">Web page</text>
  <text class="note" x="135" y="182" text-anchor="middle">Content scripts · probe</text>

    <rect class="card" x="300" y="110" width="240" height="100" rx="18"/>
  <text class="name" x="420" y="152" text-anchor="middle">Extension</text>
  <text class="note" x="420" y="182" text-anchor="middle">Background detection</text>

    <rect class="card" x="300" y="290" width="240" height="90" rx="18"/>
  <text class="name" x="420" y="328" text-anchor="middle">Panel / Workspace</text>
  <text class="note" x="420" y="356" text-anchor="middle">Resources · Downloads</text>

    <rect class="card" x="730" y="110" width="210" height="100" rx="18"/>
  <text class="name" x="835" y="152" text-anchor="middle">Native helper</text>
  <text class="note" x="835" y="182" text-anchor="middle">Rust · queue · resume</text>

    <rect class="card" x="1010" y="50" width="160" height="90" rx="18"/>
  <text class="name" x="1090" y="88" text-anchor="middle">curl</text>
  <text class="note" x="1090" y="116" text-anchor="middle">Ranged download</text>
  <rect class="card" x="1010" y="180" width="160" height="90" rx="18"/>
  <text class="name" x="1090" y="218" text-anchor="middle">FFmpeg</text>
  <text class="note" x="1090" y="246" text-anchor="middle">Remux &amp; merge</text>

    <path class="link" d="M252 160 H288" marker-end="url(#head)"/>
  <path class="link" d="M420 222 V278" marker-start="url(#head)" marker-end="url(#head)"/>
  <path class="link" d="M552 160 H718" marker-start="url(#head)" marker-end="url(#head)"/>
  <text class="label" x="635" y="146" text-anchor="middle">Native Messaging</text>
  <path class="link" d="M952 160 C 978 160, 976 95, 998 95" marker-end="url(#head)"/>
  <path class="link" d="M952 160 C 978 160, 976 225, 998 225" marker-end="url(#head)"/>

    <rect class="pill" x="265" y="412" width="130" height="40" rx="20"/>
  <text class="pill-text" x="330" y="438" text-anchor="middle">No account</text>
  <rect class="pill" x="415" y="412" width="270" height="40" rx="20"/>
  <text class="pill-text" x="550" y="438" text-anchor="middle">Tasks and settings stay local</text>
  <rect class="pill" x="705" y="412" width="230" height="40" rx="20"/>
  <text class="pill-text" x="820" y="438" text-anchor="middle">No history uploaded</text>
</svg>
